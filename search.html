<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search Buses | BUS WAVE</title>
<meta name="description" content="Browse and filter available buses for your route on BUS WAVE.">
<link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<header class="siteHeader">
  <div class="container navRow">
    <a href="index.html" class="brand"><span class="brandMark">BW</span>BUS<span class="wave">WAVE</span></a>
    <nav class="navMenu">
      <a href="index.html">Home</a>
      <a href="search.html" class="active">Search Buses</a>
      <a href="offers.html">Offers</a>
      <a href="bookings.html">My Bookings</a>
      <a href="help.html">Help</a>
    </nav>
    <div class="navActions">
      <div data-auth-slot></div>
      <button class="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="pageHero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Search Results</div>
    <div class="flexBetween" style="align-items:flex-end;flex-wrap:wrap;gap:14px">
      <div>
        <h1 id="routeTitle">Bengaluru → Kochi</h1>
        <p id="routeMeta" class="mb0"></p>
      </div>
      <form id="modifySearchForm" class="flex" style="gap:8px;flex-wrap:wrap">
        <input type="text" id="fromInput" style="border:1.5px solid var(--gray-100);border-radius:8px;padding:9px 12px;width:130px" readonly>
        <input type="text" id="toInput" style="border:1.5px solid var(--gray-100);border-radius:8px;padding:9px 12px;width:130px" readonly>
        <input type="date" id="dateInput" style="border:1.5px solid var(--gray-100);border-radius:8px;padding:9px 12px">
        <button class="btn btn--dark btn--sm" type="submit">Update</button>
      </form>
    </div>
  </div>
</section>

<section class="section--tight">
  <div class="container resultsLayout">
    <aside class="filterPanel">
      <h3>Filters</h3>
      <div class="divider"></div>

      <div class="filterGroup">
        <h4>Max Price</h4>
        <input type="range" id="priceRange" min="300" max="3000" step="50" value="3000" style="width:100%">
        <div class="priceRangeVal">Up to <span id="priceRangeVal">₹3,000</span></div>
      </div>

      <div class="filterGroup">
        <h4>Departure</h4>
        <label class="filterOption"><input type="checkbox" name="depWindow" value="early"> Before 6 AM</label>
        <label class="filterOption"><input type="checkbox" name="depWindow" value="morning"> 6 AM – 12 PM</label>
        <label class="filterOption"><input type="checkbox" name="depWindow" value="afternoon"> 12 PM – 6 PM</label>
        <label class="filterOption"><input type="checkbox" name="depWindow" value="night"> After 6 PM</label>
      </div>

      <div class="filterGroup">
        <h4>AC / Non-AC</h4>
        <label class="filterOption"><input type="radio" name="acFilter" value="all" checked> All</label>
        <label class="filterOption"><input type="radio" name="acFilter" value="ac"> AC only</label>
        <label class="filterOption"><input type="radio" name="acFilter" value="nonac"> Non-AC only</label>
      </div>

      <div class="filterGroup">
        <h4>Bus Type</h4>
        <label class="filterOption"><input type="radio" name="seatTypeFilter" value="all" checked> All</label>
        <label class="filterOption"><input type="radio" name="seatTypeFilter" value="seater"> Seater</label>
        <label class="filterOption"><input type="radio" name="seatTypeFilter" value="sleeper"> Sleeper</label>
      </div>

      <div class="filterGroup">
        <h4>Minimum Rating</h4>
        <select id="ratingFilter">
          <option value="0">Any rating</option>
          <option value="3">3★ &amp; above</option>
          <option value="4">4★ &amp; above</option>
          <option value="4.5">4.5★ &amp; above</option>
        </select>
      </div>
    </aside>

    <div>
      <div class="resultsToolbar">
        <span id="resultCount" class="badge badge--red">0 buses found</span>
        <div class="sortRow">
          <button class="sortChip active" data-sort="recommended">Recommended</button>
          <button class="sortChip" data-sort="price">Price: Low to High</button>
          <button class="sortChip" data-sort="departure">Departure</button>
          <button class="sortChip" data-sort="rating">Rating</button>
        </div>
      </div>
      <div id="resultsBox"></div>
    </div>
  </div>
</section>

<footer class="siteFooter">
  <div class="container footBottom">
    <span>© <span data-year></span> BUS WAVE. Demo project — not a real booking service.</span>
    <a href="index.html">Back to home</a>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
