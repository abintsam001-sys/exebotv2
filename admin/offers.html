<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Offers | BUS WAVE Admin</title>
<link rel="icon" href="../assets/logo/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="adminBody">
<div class="adminShell">
  <aside class="adminSidebar">
    <div class="adminBrand"><span class="brandMark">BW</span>BUS WAVE Admin</div>
    <nav class="adminNav">
      <a href="index.html">📊 Dashboard</a>
      <a href="buses.html">🚌 Manage Buses</a>
      <a href="bookings.html">🎟️ Manage Bookings</a>
      <a href="users.html">👤 Manage Users</a>
      <a href="offers.html" class="active">🏷️ Manage Offers</a>
    </nav>
    <div class="adminNavDivider"></div>
    <a href="../index.html" class="adminBackLink">← Back to main site</a>
  </aside>

  <main class="adminMain">
    <div class="adminTopbar">
      <div>
        <button class="navToggleAdmin btn btn--ghost btn--sm">☰</button>
        <h1>Manage Offers</h1>
        <p>Create and edit coupon codes available at checkout.</p>
      </div>
      <button id="addOfferBtn" class="btn btn--primary">+ Add Offer</button>
    </div>

    <div class="adminPanel">
      <table class="adminTable">
        <thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min Amount</th><th>Max Discount</th><th>Actions</th></tr></thead>
        <tbody id="adminOffersTable"></tbody>
      </table>
    </div>
  </main>
</div>

<div class="adminModal" id="offerModal">
  <div class="adminModalBox">
    <button class="modalCloseX" data-close-modal>×</button>
    <h3 id="offerModalTitle">Add Offer</h3>
    <form id="offerForm">
      <div class="formGroup"><label>Coupon Code</label><input type="text" id="ofCode" required style="text-transform:uppercase"></div>
      <div class="formRow2">
        <div class="formGroup"><label>Discount Type</label><select id="ofType"><option value="percent">Percent (%)</option><option value="flat">Flat (₹)</option></select></div>
        <div class="formGroup"><label>Value</label><input type="number" id="ofValue" required min="1"></div>
      </div>
      <div class="formRow2">
        <div class="formGroup"><label>Minimum Amount (₹)</label><input type="number" id="ofMin" required min="0"></div>
        <div class="formGroup"><label>Max Discount Cap (₹)</label><input type="number" id="ofCap" required min="1"></div>
      </div>
      <div class="formGroup"><label>Description</label><input type="text" id="ofDesc" required></div>
      <button type="submit" class="btn btn--primary btn--block">Save Offer</button>
    </form>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
